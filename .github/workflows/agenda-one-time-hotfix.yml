name: BeautyMove one-time agenda hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hotfix:
    if: contains(github.event.head_commit.message, 'hotfix: agenda action flow') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch agenda action flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('salao.html')
          s = p.read_text(encoding='utf-8')

          old = "detailActions.innerHTML=`<button class=\"action\" id=\"editAppointment\">Alterar horário / atendimento</button><button class=\"action\" id=\"addServices\">Incluir / remover serviços</button><button class=\"action green\" id=\"arrived\">Registrar chegada</button><button class=\"action red\" id=\"finish\">Finalizar atendimento</button><button class=\"action red\" id=\"cancelAppointment\">Cancelar agendamento</button><button class=\"action full\" id=\"finance\">Financeiro do atendimento</button>`;openModal('detailsModal');editAppointment.onclick=()=>{closeAll();openAppointment({id:a.id})};addServices.onclick=()=>{closeAll();openAppointment({id:a.id})};arrived.onclick=()=>{a.status='em_andamento';saveData();closeAll();render();noticeMsg('Cliente registrado como em andamento.')};finish.onclick=()=>{a.status='finalizado';saveData();closeAll();render();noticeMsg('Atendimento finalizado.')};cancelAppointment.onclick=()=>{a.status='cancelado';saveData();closeAll();render();noticeMsg('Agendamento cancelado.')};finance.onclick=()=>noticeMsg('Financeiro do atendimento: '+money(total)+'.')"
          new = "detailActions.innerHTML=`<button class=\"action\" id=\"editAppointment\">Alterar horário / atendimento</button><button class=\"action\" id=\"addServices\">Incluir / remover serviços</button><button class=\"action green\" id=\"arrived\">Registrar chegada</button><button class=\"action red\" id=\"finish\">Finalizar atendimento</button><button class=\"action red\" id=\"cancelAppointment\">Cancelar agendamento</button><button class=\"action full\" id=\"requestSosFromAppointment\">S.O.S. Profissionais</button><button class=\"action full\" id=\"finance\">Financeiro do atendimento</button>`;openModal('detailsModal');editAppointment.onclick=()=>{closeAll();openAppointment({id:a.id})};addServices.onclick=()=>{closeAll();openAppointment({id:a.id})};arrived.onclick=()=>{a.status='em_andamento';saveData();closeAll();render();noticeMsg('Cliente registrado como em andamento.')};finish.onclick=()=>{a.status='finalizado';saveData();closeAll();render();noticeMsg('Atendimento finalizado.')};cancelAppointment.onclick=()=>{a.status='cancelado';saveData();closeAll();render();noticeMsg('Agendamento cancelado. O horário voltou a ficar livre.')};requestSosFromAppointment.onclick=()=>{closeAll();openSosForAppointment(a)};finance.onclick=()=>noticeMsg('Financeiro do atendimento: '+money(total)+'.')"
          if old not in s:
              raise SystemExit('details action block not found')
          s = s.replace(old, new, 1)

          old2 = "function openSos(t){sosTime.innerHTML=times().map(x=>`<option ${x===(t||'08:00')?'selected':''}>${x}</option>`).join('');sosClient.value='';sosService.value='';openModal('sosModal')}\nsosForm.onsubmit=e=>{e.preventDefault();data.sos.push({id:'s'+Date.now(),date:key(date),time:sosTime.value,client:sosClient.value.trim(),service:sosService.value.trim(),specialty:sosSpecialty.value});saveData();closeAll();render();noticeMsg('S.O.S. enviado e registrado na coluna S.O.S.')}"
          new2 = "function openSos(t){sosTime.innerHTML=times().map(x=>`<option ${x===(t||'08:00')?'selected':''}>${x}</option>`).join('');sosClient.value='';sosService.value='';openModal('sosModal')}\nfunction openSosForAppointment(a){sosTime.innerHTML=times().map(x=>`<option ${x===a.time?'selected':''}>${x}</option>`).join('');sosClient.value=a.client;sosService.value=a.services.map(s=>s[0]).join(' + ');sosSpecialty.value='Cabelos';sosForm.dataset.appointmentId=a.id;openModal('sosModal');sosClient.focus()}\nsosForm.onsubmit=e=>{e.preventDefault();const appointmentId=sosForm.dataset.appointmentId||'';data.sos.push({id:'s'+Date.now(),appointmentId,date:key(date),time:sosTime.value,client:sosClient.value.trim(),service:sosService.value.trim(),specialty:sosSpecialty.value});delete sosForm.dataset.appointmentId;saveData();closeAll();render();noticeMsg(appointmentId?'S.O.S. criado para o atendimento. A cliente continua na Agenda no horário original.':'S.O.S. enviado e registrado na coluna S.O.S.')}"
          if old2 not in s:
              raise SystemExit('sos block not found')
          s = s.replace(old2, new2, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit hotfix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salao.html .github/workflows/agenda-one-time-hotfix.yml
          git rm .github/workflows/agenda-one-time-hotfix.yml
          git commit -m "hotfix: agenda action flow"
          git push
