name: Apply approved agenda layout

on:
  push:
    branches: [build/mvp-v1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply approved visual layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('salao.html')
          s = p.read_text(encoding='utf-8')
          marker = '</head>'
          css = '''<style id="beautymove-approved-layout">
          :root{--bm-p:#5b20d8;--bm-line:#e7e2ec}
          body{background:#fbfafc!important}
          .app{grid-template-columns:225px 1fr!important}
          .sidebar{background:#fff!important}
          .nav a.active{background:var(--bm-p)!important;color:#fff!important}
          .main{padding:24px 28px 38px!important}
          .top{border-bottom:1px solid var(--bm-line)!important;padding-bottom:18px!important}
          .toolbar{padding:17px 0 12px!important}
          .grid thead th{text-align:center!important;height:78px!important}
          .specialty{font-size:13px!important;font-weight:900!important;color:#312c39!important;text-align:center!important}
          .professional{font-size:16px!important;font-weight:900!important;text-align:center!important}
          .specialty-band{height:6px!important;border-radius:6px!important;margin:8px 10px 6px!important}
          .soscol,.sos-cell{width:225px!important;min-width:225px!important}
          .sostitle,.sos-head{color:var(--bm-p)!important;font-weight:900!important}
          .sosbutton{border-color:var(--bm-p)!important;color:var(--bm-p)!important;background:#fff!important}
          .sosbutton:hover{background:#f2eaff!important}
          .summary{grid-template-columns:1fr 1fr!important}
          .sidebottom{display:none!important}
          </style>'''
          if 'id="beautymove-approved-layout"' not in s:
              s = s.replace(marker, css + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit layout changes
        run: |
          git config user.name "BeautyMove Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salao.html
          git diff --cached --quiet || git commit -m "Apply approved BeautyMove agenda layout"
          git push