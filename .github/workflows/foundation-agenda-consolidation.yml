name: One-time Agenda Consolidation

on:
  push:
    branches:
      - foundation/agenda-consolidation-2026-08-19

permissions:
  contents: write

jobs:
  consolidate:
    if: ${{ !contains(github.event.head_commit.message, 'chore: consolidate agenda runtime') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate Agenda runtime
        shell: python
        run: |
          from pathlib import Path
          import re
          import shutil

          root = Path('.')
          salon = root / 'salao.html'
          html = salon.read_text(encoding='utf-8')

          # Remove every Agenda-specific CSS/JS include from the production salon page.
          # Keep the base stylesheet/controller out of this sweep; canonical files are
          # inserted explicitly below.
          tag_re = re.compile(r'<(link|script)\b[^>]*(?:href|src)=["\'][^"\']*(?:agenda-[^"\']+|agenda\.css|agenda\.js|sos-opportunity-panel\.css|sos-opportunity-panel\.js)[^"\']*["\'][^>]*>(?:</script>)?', re.I)
          html = tag_re.sub('', html)

          canonical_css = root / 'assets/css/agenda-canonical.css'
          css_sources = [
              root / 'assets/css/agenda.css',
              root / 'assets/css/agenda-approved-layout.css',
              root / 'assets/css/agenda-toolbar-final.css',
              root / 'assets/css/agenda-date-fix.css',
              root / 'assets/css/agenda-sticky-header-final.css',
          ]
          canonical_css.write_text(
              '\n\n/* ===== Consolidated source: {} ===== */\n'.format(' + '.join(p.name for p in css_sources))
              + '\n\n'.join(p.read_text(encoding='utf-8') for p in css_sources),
              encoding='utf-8'
          )

          canonical_js = root / 'assets/js/agenda-canonical.js'
          canonical_js.write_text((root / 'assets/js/agenda.js').read_text(encoding='utf-8'), encoding='utf-8')

          # Insert the only authoritative Agenda CSS/controller immediately before the
          # existing generic salon assets end marker. If the page has no </head>, fail.
          if '</head>' not in html.lower():
              raise SystemExit('salao.html has no closing </head>')
          html = re.sub(
              r'(</head>)',
              '  <link rel="stylesheet" href="assets/css/agenda-canonical.css">\n\\1',
              html,
              count=1,
              flags=re.I,
          )
          if '</body>' not in html.lower():
              raise SystemExit('salao.html has no closing </body>')
          html = re.sub(
              r'(</body>)',
              '  <script src="assets/js/agenda-canonical.js"></script>\n\\1',
              html,
              count=1,
              flags=re.I,
          )
          salon.write_text(html, encoding='utf-8')

          # Archive only Agenda patch assets that are no longer referenced by any
          # runtime HTML after the consolidation. Keep files that still have live refs.
          archive = root / 'legacy/agenda-2026-08-19'
          archive.mkdir(parents=True, exist_ok=True)
          candidates = [
              p for p in (root / 'assets/css').glob('agenda-*.css')
              if p.name not in {'agenda-approved-layout.css'}
              and p.name not in {'agenda-canonical.css'}
          ] + [
              p for p in (root / 'assets/js').glob('agenda-*.js')
              if p.name not in {'agenda.js', 'agenda-canonical.js'}
          ] + [
              root / 'assets/css/sos-opportunity-panel.css',
              root / 'assets/js/sos-opportunity-panel.js',
          ]

          for p in candidates:
              if not p.exists():
                  continue
              needle = p.as_posix()
              live_refs = []
              for f in root.rglob('*'):
                  if not f.is_file() or '.git' in f.parts or 'legacy' in f.parts:
                      continue
                  if f == p:
                      continue
                  try:
                      text = f.read_text(encoding='utf-8')
                  except Exception:
                      continue
                  if p.name in text or needle in text:
                      live_refs.append(f)
              if not live_refs:
                  shutil.move(str(p), str(archive / p.name))

          # Remove this one-time migration workflow after its work is complete.
          wf = root / '.github/workflows/foundation-agenda-consolidation.yml'
          if wf.exists():
              wf.unlink()

          # Static integrity checks.
          import subprocess
          subprocess.run(['node', '--check', str(canonical_js)], check=True)
          final_html = salon.read_text(encoding='utf-8')
          assert final_html.count('agenda-canonical.css') == 1
          assert final_html.count('agenda-canonical.js') == 1
          assert 'agenda-sticky-header-final.css' not in final_html
          assert 'agenda-detail-actions-fix.js' not in final_html

      - name: Commit consolidated runtime
        run: |
          git config user.name "BeautyMove Foundation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: consolidate agenda runtime"
          git push origin HEAD:foundation/agenda-consolidation-2026-08-19
