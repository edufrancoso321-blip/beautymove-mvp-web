<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cadastro — BeautyMove</title><link rel="stylesheet" href="assets/css/styles.css"></head>
<body>
<div class="page"><header class="header"><a href="index.html"><img src="LOGO BM FUNDO BRANCO.png" alt="BeautyMove" class="logo"></a><a class="header-link" href="index.html">Voltar</a></header>
<main><div class="container form-wrap"><div class="card form-card"><div class="form-head"><h1 id="registrationTitle">Cadastro BeautyMove</h1><p id="registrationDescription">Preencha os dados básicos para continuar.</p></div>
<form id="registrationForm"><input type="hidden" id="role" name="role"><div class="form-grid">
<div class="field"><label for="nome">Nome</label><input id="nome" name="nome" type="text" required placeholder="Seu nome"></div>
<div class="field"><label for="telefone">Telefone / WhatsApp</label><input id="telefone" name="telefone" type="tel" required placeholder="(00) 00000-0000"></div>
<div class="field full"><label for="email">E-mail</label><input id="email" name="email" type="email" required placeholder="seuemail@exemplo.com" autocomplete="email"></div>
<div class="field full"><label for="password">Senha</label><div class="password-wrap"><input id="password" name="password" type="password" minlength="6" required placeholder="Mínimo de 6 caracteres" autocomplete="new-password"><button class="password-toggle" type="button" data-password-toggle="password" aria-label="Mostrar senha" title="Mostrar senha">◉</button></div></div>
<div class="field full"><label for="passwordConfirm">Confirmar senha</label><div class="password-wrap"><input id="passwordConfirm" name="passwordConfirm" type="password" minlength="6" required placeholder="Digite a senha novamente" autocomplete="new-password"><button class="password-toggle" type="button" data-password-toggle="passwordConfirm" aria-label="Mostrar senha" title="Mostrar senha">◉</button></div></div>
<div class="field full" id="salaoField"><label for="nomeSalao">Nome do salão</label><input id="nomeSalao" name="nomeSalao" type="text" placeholder="Nome do estabelecimento"></div>
<div class="field full" id="specialtyField">
<label id="specialtyLabel">Especialidades</label>
<div id="salonSpecialties" class="specialty-dropdown">
<details>
<summary>Selecione as especialidades</summary>
<div class="specialty-options">
<label class="choice"><input type="checkbox" name="especialidades" value="Cabelos"> Cabelos</label>
<label class="choice"><input type="checkbox" name="especialidades" value="Mãos e Pés"> Mãos e Pés</label>
<label class="choice"><input type="checkbox" name="especialidades" value="Estética"> Estética</label>
<label class="choice"><input type="checkbox" name="especialidades" value="Depilação"> Depilação</label>
<label class="choice"><input type="checkbox" name="especialidades" value="Sobrancelhas"> Sobrancelhas</label>
</div>
</details>
</div>
<div id="singleSpecialty"><select id="especialidade" name="especialidade"><option value="">Selecione</option><option>Cabelos</option><option>Mãos e Pés</option><option>Estética</option><option>Depilação</option><option>Sobrancelhas</option><option>Auxiliar de cabeleireiro</option></select></div>
</div>
</div><p id="registrationError" class="form-error" hidden></p><div class="form-actions"><a class="secondary" href="index.html">Cancelar</a><button class="primary" type="submit">Continuar</button></div></form>
</div></div></main><footer class="footer">BeautyMove © 2026</footer></div>
<script src="assets/js/firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore-compat.js"></script>
<script src="assets/js/firebase-client-v2.js"></script>
<script src="assets/js/auth-fixed.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
const registrationRole = new URLSearchParams(window.location.search).get('perfil') || '';
const salaoField = document.querySelector('#salaoField');
const specialtyField = document.querySelector('#specialtyField');
const salonSpecialties = document.querySelector('#salonSpecialties');
const singleSpecialty = document.querySelector('#singleSpecialty');
const specialtyLabel = document.querySelector('#specialtyLabel');
const nomeSalao = document.querySelector('#nomeSalao');
const especialidade = document.querySelector('#especialidade');

if (registrationRole !== 'salao') { salaoField.hidden = true; nomeSalao.required = false; }
if (registrationRole === 'salao') { singleSpecialty.hidden = true; especialidade.required = false; }
else if (registrationRole === 'profissional') { salonSpecialties.hidden = true; specialtyLabel.textContent = 'Tipo de profissional'; especialidade.required = true; }
else { specialtyField.hidden = true; especialidade.required = false; }

document.querySelectorAll('[data-password-toggle]').forEach((button) => {
  button.addEventListener('click', () => {
    const input = document.getElementById(button.dataset.passwordToggle); if (!input) return;
    const visible = input.type === 'text'; input.type = visible ? 'password' : 'text';
    button.textContent = visible ? '◉' : '●'; button.setAttribute('aria-label', visible ? 'Mostrar senha' : 'Ocultar senha'); button.title = visible ? 'Mostrar senha' : 'Ocultar senha';
  });
});

document.querySelectorAll('#salonSpecialties input[type="checkbox"]').forEach((checkbox) => {
  checkbox.addEventListener('change', () => {
    const selected = [...document.querySelectorAll('#salonSpecialties input[type="checkbox"]:checked')].map((item) => item.value);
    const summary = document.querySelector('#salonSpecialties summary'); if (summary) summary.textContent = selected.length ? selected.join(', ') : 'Selecione as especialidades';
  });
});
</script>
</body></html>
