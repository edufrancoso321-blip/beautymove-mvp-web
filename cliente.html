<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeautyMove — Cliente</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-role="cliente">
  <div class="page">
    <header class="header">
      <a href="index.html"><img src="LOGO BM FUNDO BRANCO.png" alt="BeautyMove" class="logo"></a>
      <a class="header-link" href="index.html">Sair</a>
    </header>
    <main>
      <div class="container dashboard">
        <div class="dashboard-head">
          <div><h1 id="dashboardTitle">Área do cliente</h1><p id="dashboardSubtitle">Encontre serviços e acompanhe seus agendamentos.</p></div>
          <div class="actions"><a class="primary" href="#busca">Buscar serviços</a></div>
        </div>
        <div class="dashboard-grid">
          <div class="card metric"><span>Próximos</span><strong>0</strong><span>agendamentos</span></div>
          <div class="card metric"><span>Histórico</span><strong>0</strong><span>atendimentos</span></div>
          <div class="card metric"><span>Favoritos</span><strong>0</strong><span>salvos</span></div>
        </div>
        <section class="section" id="busca">
          <div class="card"><h2>Buscar serviços</h2><p>Esta área será conectada ao catálogo e à busca de profissionais na próxima camada do MVP.</p></div>
        </section>
      </div>
    </main>
    <footer class="footer">BeautyMove © 2026</footer>
  </div>
  <script src="assets/js/app.js"></script>
</body>
</html>
